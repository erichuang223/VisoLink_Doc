<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="28" fill="#fff7f7"/><text x="64" y="70" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="30" font-weight="700" fill="#7b2727">清除 Runtime Cache：執行前確認</text><g font-family="Segoe UI,Microsoft JhengHei,sans-serif"><rect x="64" y="125" width="320" height="190" rx="18" fill="#fff" stroke="#efc7c7"/><text x="96" y="175" font-size="22" font-weight="700" fill="#172536">1. 評估影響</text><text x="96" y="218" font-size="17" fill="#617185">• 來源設備承載能力</text><text x="96" y="254" font-size="17" fill="#617185">• 可監控的維護時段</text><rect x="440" y="125" width="320" height="190" rx="18" fill="#fff" stroke="#efc7c7"/><text x="472" y="175" font-size="22" font-weight="700" fill="#172536">2. 完整確認</text><text x="472" y="218" font-size="17" fill="#617185">• 閱讀畫面警告</text><text x="472" y="254" font-size="17" fill="#617185">• 輸入指定確認文字</text><rect x="816" y="125" width="320" height="190" rx="18" fill="#fff" stroke="#efc7c7"/><text x="848" y="175" font-size="22" font-weight="700" fill="#172536">3. 監看回補</text><text x="848" y="218" font-size="17" fill="#617185">• Cache Key 逐步恢復</text><text x="848" y="254" font-size="17" fill="#617185">• Runtime 與來源負荷正常</text><rect x="64" y="355" width="1072" height="64" rx="14" fill="#fde0e0"/><text x="600" y="395" text-anchor="middle" font-size="18" font-weight="700" fill="#7b2727">清除不會刪除來源資料，但會使 Runtime 大量重新查詢。</text></g></svg>
