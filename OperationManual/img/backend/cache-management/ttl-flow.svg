<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="28" fill="#f5f7fb"/><text x="64" y="70" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="30" font-weight="700" fill="#172536">Cache TTL Policy</text><text x="64" y="108" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="17" fill="#617185">近期資料與歷史資料可使用不同保存時間。</text><g font-family="Segoe UI,Microsoft JhengHei,sans-serif"><rect x="64" y="150" width="500" height="210" rx="20" fill="#fff" stroke="#dce4eb"/><text x="100" y="205" font-size="24" font-weight="700" fill="#12304d">01　近期資料</text><text x="100" y="250" font-size="17" fill="#617185">更新頻率較高，可保留較長時間</text><rect x="100" y="285" width="420" height="48" rx="10" fill="#f4f7f9"/><text x="120" y="316" font-size="18" fill="#172536">TTL 秒數　依容量與查詢成本設定</text><rect x="636" y="150" width="500" height="210" rx="20" fill="#fff" stroke="#dce4eb"/><text x="672" y="205" font-size="24" font-weight="700" fill="#12304d">02　歷史資料</text><text x="672" y="250" font-size="17" fill="#617185">查詢量較大，可使用較短保存時間</text><rect x="672" y="285" width="420" height="48" rx="10" fill="#f4f7f9"/><text x="692" y="316" font-size="18" fill="#172536">TTL 秒數　避免重複長時間占用</text><rect x="64" y="397" width="330" height="54" rx="12" fill="#146aa3"/><text x="229" y="431" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1. 儲存新政策</text><path d="M412 424h110" stroke="#38b9ce" stroke-width="6"/><path d="m508 409 20 15-20 15" fill="none" stroke="#38b9ce" stroke-width="6"/><rect x="540" y="397" width="330" height="54" rx="12" fill="#146aa3"/><text x="705" y="431" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2. 套用現有 Key</text><path d="M888 424h72" stroke="#38b9ce" stroke-width="6"/><path d="m946 409 20 15-20 15" fill="none" stroke="#38b9ce" stroke-width="6"/><text x="988" y="431" font-size="18" font-weight="700" fill="#207a5a">觀察 Runtime</text></g></svg>
