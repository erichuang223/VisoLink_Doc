<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="28" fill="#f5f7fb"/><text x="64" y="70" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="30" font-weight="700" fill="#172536">Runtime Cache Key 篩選與處理</text><g font-family="Segoe UI,Microsoft JhengHei,sans-serif"><rect x="64" y="130" width="1072" height="72" rx="16" fill="#fff" stroke="#dce4eb"/><text x="92" y="174" font-size="20" fill="#617185">搜尋 DataBinding、設備識別或 Key</text><rect x="900" y="145" width="200" height="42" rx="10" fill="#146aa3"/><text x="1000" y="173" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">套用篩選</text><rect x="64" y="230" width="1072" height="130" rx="18" fill="#fff" stroke="#dce4eb"/><text x="100" y="275" font-size="18" font-weight="700" fill="#12304d">選取</text><text x="250" y="275" font-size="18" font-weight="700" fill="#12304d">DataBinding／Key</text><text x="650" y="275" font-size="18" font-weight="700" fill="#12304d">大小／筆數</text><text x="860" y="275" font-size="18" font-weight="700" fill="#12304d">TTL</text><text x="1010" y="275" font-size="18" font-weight="700" fill="#12304d">狀態</text><line x1="92" y1="292" x2="1108" y2="292" stroke="#dce4eb"/><rect x="104" y="313" width="20" height="20" rx="3" fill="#fff" stroke="#617185"/><text x="250" y="330" font-size="17" fill="#617185">目標資料／識別碼</text><text x="650" y="330" font-size="17" fill="#617185">37 KB／188</text><text x="860" y="330" font-size="17" fill="#617185">18.7 小時</text><rect x="1000" y="305" width="74" height="32" rx="16" fill="#eaf7f1"/><text x="1037" y="327" text-anchor="middle" font-size="15" font-weight="700" fill="#207a5a">正常</text><rect x="64" y="390" width="1072" height="62" rx="14" fill="#fff6de"/><text x="92" y="429" font-size="17" font-weight="700" fill="#704f0a">先縮小至明確範圍，再選取與刪除；大量刪除會增加來源查詢負荷。</text></g></svg>
