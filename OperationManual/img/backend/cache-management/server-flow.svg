<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#f5f7fb"/><text x="64" y="70" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="30" font-weight="700" fill="#172536">Cache Server 管理流程</text><text x="64" y="106" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="17" fill="#617185">以名稱與用途辨識設備；連線資訊與憑證不放入公開文件。</text><g font-family="Segoe UI,Microsoft JhengHei,sans-serif"><rect x="64" y="155" width="300" height="230" rx="20" fill="#fff" stroke="#dce4eb"/><circle cx="110" cy="205" r="24" fill="#146aa3"/><text x="110" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="148" y="211" font-size="23" font-weight="700" fill="#12304d">登錄 Server</text><text x="96" y="262" font-size="17" fill="#617185">• 名稱與用途</text><text x="96" y="298" font-size="17" fill="#617185">• 核准的連線設定</text><text x="96" y="334" font-size="17" fill="#617185">• 啟用狀態</text><path d="M380 270h70" stroke="#38b9ce" stroke-width="6"/><path d="m438 255 20 15-20 15" fill="none" stroke="#38b9ce" stroke-width="6"/><rect x="460" y="155" width="280" height="230" rx="20" fill="#fff" stroke="#dce4eb"/><circle cx="506" cy="205" r="24" fill="#146aa3"/><text x="506" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="544" y="211" font-size="23" font-weight="700" fill="#12304d">測試連線</text><text x="492" y="262" font-size="17" fill="#617185">• 顯示成功狀態</text><text x="492" y="298" font-size="17" fill="#617185">• 失敗先檢查網路</text><text x="492" y="334" font-size="17" fill="#617185">• 不重複盲目送出</text><path d="M756 270h70" stroke="#38b9ce" stroke-width="6"/><path d="m814 255 20 15-20 15" fill="none" stroke="#38b9ce" stroke-width="6"/><rect x="836" y="155" width="300" height="230" rx="20" fill="#fff" stroke="#dce4eb"/><circle cx="882" cy="205" r="24" fill="#207a5a"/><text x="882" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="920" y="211" font-size="23" font-weight="700" fill="#12304d">分配負荷</text><text x="868" y="262" font-size="17" fill="#617185">• 指派設備或工作</text><text x="868" y="298" font-size="17" fill="#617185">• 比較各 Server 負荷</text><text x="868" y="334" font-size="17" fill="#617185">• 停用前先完成移轉</text></g><rect x="64" y="420" width="1072" height="55" rx="14" fill="#fff0f0"/><text x="92" y="454" font-family="Segoe UI,Microsoft JhengHei,sans-serif" font-size="17" font-weight="700" fill="#7b2727">刪除或停用仍被使用的 Cache Server，可能造成 Runtime 監看中斷。</text></svg>
